<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nous contacter — SwiperNews</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#190501;color:#f7f6ff;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:24px;box-sizing:border-box}
  .card{max-width:440px;width:100%}
  .logo{width:56px;height:56px;border-radius:14px;margin-bottom:20px}
  h1{font-size:22px;margin:0 0 12px}
  p{color:#baadab;margin:0 0 16px}
  a.btn{display:inline-block;background:#fa5838;color:#190501;font-weight:700;text-decoration:none;
    padding:14px 22px;border-radius:999px;margin:8px 0 20px}
  a.back{color:#fcac9c;text-decoration:none;font-size:14px}
  a.back:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card" id="card">
  <img class="logo" src="/logo-192.png" alt="" width="56" height="56">
  <h1 id="h1">Nous contacter</h1>
  <p id="p1">Une question, un bug à signaler, un retour sur l'app ? Écrivez-nous directement :</p>
  <a class="btn" href="mailto:contact@lielu.eu">contact@lielu.eu</a>
  <p><a class="back" id="back" href="/">← Retour à SwiperNews</a></p>
</div>
<script>
// Même détection minimale qu'add.html : pas de couche i18n complète pour
// deux pages statiques hors app, juste de quoi ne pas afficher du français à
// un lecteur anglophone.
(function(){
  if(/^en/i.test(navigator.language||"")){
    document.title="Contact us — SwiperNews";
    document.getElementById("h1").textContent="Contact us";
    document.getElementById("p1").textContent="A question, a bug to report, feedback on the app? Write to us directly:";
    document.getElementById("back").textContent="← Back to SwiperNews";
  }
})();
</script>
</body>
</html>
