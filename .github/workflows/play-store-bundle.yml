name: Play Store AAB

# Build ET publication automatique sur Google Play (canal Tests fermés,
# track API "alpha" — nom historique de Google pour ce canal, indépendant du
# libellé "Tests fermés" affiché dans Play Console). Séparé d'android.yml/
# release.yml : ceux-là produisent des .apk signés de la clé du PROJET (celle
# que F-Droid vérifie, AllowedAPKSigningKeys). Play Store, lui, utilise le
# modèle Play App Signing : on signe seulement d'une clé d'UPLOAD
# (PLAY_STORE_*, distincte), que Google re-signe ensuite de sa propre clé —
# les deux clés ne se mélangent jamais.
#
# Déclenchement manuel (workflow_dispatch) : publier à chaque push serait
# trop agressif pour des testeurs externes (chaque commit, même mineur,
# irait jusqu'à eux). C'est un choix humain — lancé quand on a accumulé assez
# de changements pour valoir une nouvelle version testée.
#
# versionCode/versionName pour CE canal sont calculés ICI, jamais écrits
# dans android/app/build.gradle : ce fichier reste réservé à la version
# « officielle », celle que le tag vX.Y.Z et la recette F-Droid attendent en
# LITTÉRAL (voir CLAUDE.md, « Publier une version »). Le toucher pour chaque
# publication Play Store casserait ce contrat, et risquerait la recette
# F-Droid actuellement en revue (fdroiddata!44729). android.yml calcule déjà
# ses versionCode de préversion de la même façon, par -P, sans jamais
# modifier le fichier — même principe ici.
#
# Aucun plugin Gradle (Gradle Play Publisher) : il faudrait l'appliquer dans
# android/build.gradle ou android/app/build.gradle, partagés avec F-Droid et
# android.yml — un nouveau plugin y ajouterait une résolution réseau à CHAQUE
# build, y compris ceux de F-Droid, pour un besoin qui ne concerne que ce
# seul workflow. La publication passe donc par une Action dédiée
# (r0adkll/upload-google-play), qui parle à l'API Play Console directement
# depuis CE job, sans toucher au projet Android.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # plancher de la CLI Capacitor 8, qui refuse Node 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # exigé par Capacitor 8 / AGP 8.13
          cache: gradle

      - name: Install dependencies
        run: |
          for essai in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "::warning::npm ci a échoué (tentative $essai/3), nouvelle tentative"
            sleep $((essai * 15))
          done
          echo "::error::npm ci a échoué trois fois de suite"
          exit 1

      - name: Prépare le SDK Android
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Synchronise les assets web dans le projet natif
        run: npm run cap:sync

      # Base lue dans les sources (jamais modifiée), + numéro de run pour un
      # versionCode qui grandit à chaque publication sans jamais entrer en
      # collision avec un envoi précédent — Play Store refuse un code déjà
      # utilisé, même sur un autre canal.
      - name: Calcule la version de publication
        id: version
        run: |
          set -euo pipefail
          base_name="$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' android/app/build.gradle)"
          base_code="$(sed -n 's/^ *versionCode \([0-9]*\)$/\1/p' android/app/build.gradle)"
          if [ -z "$base_name" ] || [ -z "$base_code" ]; then
            echo "::error::versionCode/versionName introuvables dans android/app/build.gradle."
            exit 1
          fi
          code=$((base_code + ${{ github.run_number }}))
          name="$base_name.${{ github.run_number }}"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "versionCode=$code, versionName=$name" >> "$GITHUB_STEP_SUMMARY"

      - name: Déchiffre la clé d'upload Play Store
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_STORE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret PLAY_STORE_KEYSTORE_B64 manquant."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/play-upload.keystore"

      - name: Build AAB
        id: build
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/play-upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PLAY_STORE_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.PLAY_STORE_KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.PLAY_STORE_KEY_PASSWORD }}
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew bundleRelease --no-daemon \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }}
          aab="swipernews-${{ steps.version.outputs.name }}.aab"
          mv app/build/outputs/bundle/release/app-release.aab "../$aab"
          echo "aab=$aab" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.aab }}
          path: ${{ steps.build.outputs.aab }}
          if-no-files-found: error
          retention-days: 30

      # Publie directement sur le canal Tests fermés (track API "alpha").
      # serviceAccountJsonPlainText prend le secret tel quel, sans écrire de
      # fichier à la main : moins de surface pour laisser traîner la clé.
      - name: Publie sur Google Play (Tests fermés)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: eu.lielu.news
          releaseFile: ${{ steps.build.outputs.aab }}
          track: alpha
          status: completed
