name: Android APK

# Pendant Vercel côté web : chaque push sur main/staging (et chaque PR) produit
# un APK, sans passer par Android Studio. Les fichiers purement documentaires ne
# déclenchent rien — ils ne changent pas le contenu embarqué dans le paquet.
on:
  push:
    branches: [main, staging]
    paths-ignore:
      - "README.md"
      - "AUDIT.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "README.md"
      - "AUDIT.md"
      - "LICENSE"
  workflow_dispatch:

# Un seul build par branche : un nouveau push annule celui d'avant.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # nécessaire pour publier la release qui porte l'APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # plancher de la CLI Capacitor 8, qui refuse Node 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # exigé par Capacitor 8 / AGP 8.13
          cache: gradle

      - name: Install dependencies
        run: npm ci

      # compileSdk 36 n'est pas toujours présent sur l'image du runner.
      - name: Prépare le SDK Android
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      # www/ est un miroir régénéré des fichiers racine (jamais versionné),
      # cap sync le recopie ensuite dans le projet natif.
      - name: Synchronise les assets web dans le projet natif
        run: npm run cap:sync

      # versionCode doit croître à chaque publication pour qu'Android accepte
      # d'installer par-dessus. Le numéro de run seul ne suffit PAS : il vit sur
      # une échelle sans rapport avec celle des versions publiées (build.gradle,
      # majeur × 10⁸ + mineur × 10⁶ + correctif × 10⁴). Un APK de main portant
      # « 76 » face au « 10301 » du tag v1.3.1 était une rétrogradation, donc
      # impossible à installer par-dessus sans désinstaller d'abord.
      #
      # On le loge donc dans les quatre chiffres que le littéral des sources
      # laisse libres, mais SOUS son palier : un build de main est une
      # préversion de la version que build.gradle prépare, pas sa suite.
      #
      #   tag v1.3.1 ....... 10301        (ancienne échelle, déjà publié)
      #   main build 77 .... 103010077    = 103020000 − 10000 + 77
      #   tag v1.3.2 ....... 103020000
      #   main build 80 .... 103020080    (préversion de 1.3.3)
      #   tag v1.3.3 ....... 103030000
      #
      # Ajouter au palier plutôt que soustraire mettrait les builds CI AU-DESSUS
      # du tag de leur propre version, qui deviendrait alors ininstallable par
      # dessus eux — l'inverse exact du problème qu'on corrige.
      - name: Calcule la version
        id: version
        run: |
          set -euo pipefail
          base="$(node -p "require('./package.json').version")"
          build="${{ github.run_number }}"
          release_code="$(sed -n 's/^ *versionCode \([0-9]*\)$/\1/p' android/app/build.gradle)"
          if [ -z "$release_code" ]; then
            echo "::error::versionCode introuvable dans android/app/build.gradle : il doit y rester un littéral (F-Droid le lit de la même façon)."
            exit 1
          fi
          # À 10000 le build atteindrait le palier de la version préparée et
          # entrerait en collision avec son tag. Le compteur de runs ne
          # redescendant pas, il faudra alors élargir le palier (10⁵) plutôt
          # que rogner ici.
          if [ "$build" -ge 10000 ]; then
            echo "::error::Numéro de run $build ≥ 10000 : le palier de versionCode est saturé, voir android/app/build.gradle."
            exit 1
          fi
          code=$((release_code - 10000 + build))
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            name="$base.$build"
          else
            name="$base.$build-${{ github.ref_name }}"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "versionCode=$code, versionName=$name" >> "$GITHUB_STEP_SUMMARY"

      # Sans clé de signature en secret, on retombe sur un APK debug :
      # installable pour tester, mais impossible à mettre à jour par-dessus
      # (clé debug régénérée à chaque run). Voir README pour l'ajouter.
      - name: Déchiffre la clé de signature
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Aucun secret ANDROID_KEYSTORE_BASE64 : build debug, non publiée en release."
          fi

      - name: Build APK
        id: build
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          set -euo pipefail
          gradle_args=(
            -PversionCode=${{ steps.version.outputs.code }}
            -PversionName=${{ steps.version.outputs.name }}
            --no-daemon
          )
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease "${gradle_args[@]}"
            src=app/build/outputs/apk/release/app-release.apk
          else
            ./gradlew assembleDebug "${gradle_args[@]}"
            src=app/build/outputs/apk/debug/app-debug.apk
          fi
          apk="swipernews-${{ steps.version.outputs.name }}.apk"
          mv "$src" "../$apk"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.apk }}
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error
          retention-days: 90

      # L'artefact du run est toujours servi zippé par GitHub ; une release, elle,
      # donne un .apk téléchargeable en direct — donc installable depuis le
      # téléphone. Trois cas :
      #   signé + main    → une release par build, marquée « latest » ;
      #   signé + staging → préversion roulante, toujours à la même adresse ;
      #   non signé       → préversion roulante « debug », par branche.
      # Pas de condition sur pull_request (une PR ne publie jamais). Un
      # déclenchement manuel (workflow_dispatch) publie comme un push — c'est
      # le seul recours quand le push lui-même ne relance pas l'action.
      - name: Publie la release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.build.outputs.apk }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${{ steps.keystore.outputs.signed }}" != "true" ]; then
            tag="android-debug-$BRANCH"
            title="Android debug — $BRANCH (build ${{ github.run_number }})"
            notes="APK **debug** : signé d'une clé jetable, régénérée à chaque build. Installable pour tester, mais à désinstaller avant de poser le suivant. Ajouter les secrets ANDROID_* pour des paquets signés durablement (voir README). Produit depuis ${{ github.sha }}."
            rolling=1
            flag=--prerelease
          elif [ "$BRANCH" = "main" ]; then
            tag="android-v${{ steps.version.outputs.name }}"
            title="Android $tag"
            notes="APK signé produit depuis ${{ github.sha }}."
            rolling=0
            flag=--latest
          else
            tag="android-staging"
            title="Android staging (build ${{ github.run_number }})"
            notes="Préversion roulante signée, produite depuis ${{ github.sha }}."
            rolling=1
            flag=--prerelease
          fi
          # Une release roulante réutilise son tag : on efface l'ancienne d'abord.
          if [ "$rolling" = 1 ]; then
            gh release delete "$tag" --cleanup-tag --yes || true
          fi
          gh release create "$tag" "$APK" --title "$title" --notes "$notes" "$flag"
          url="${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag"
          echo "### APK publié : [$APK]($url)" >> "$GITHUB_STEP_SUMMARY"
