# Ponctuel (audit 2026-11-11) : met à jour Capacitor (CVE-2026-103922, corrigé en 8.5.1)
# dans les limites de package.json, commite le lockfile et se supprime lui-même.
name: maj-capacitor
on:
  push:
    branches: ["security/fix-2026-11-11"]
    paths: [".github/workflows/maj-capacitor.yml"]
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          set -euo pipefail
          npm update --ignore-scripts @capacitor/android @capacitor/core @capacitor/cli @capacitor/app
          node -p "['android','core','cli','app'].map(p=>p+' '+require('./node_modules/@capacitor/'+p+'/package.json').version).join('\n')"
          v=$(node -p "require('./node_modules/@capacitor/android/package.json').version")
          node -e "const [a,b,c]='$v'.split('.').map(Number); if(a<8||(a==8&&b<5)||(a==8&&b==5&&c<1)) process.exit(1)"
          git rm -q .github/workflows/maj-capacitor.yml
          git add package-lock.json
          git -c user.name="github-actions[bot]" -c user.email="41898333+github-actions[bot]@users.noreply.github.com" \
            commit -m "fix(deps): Capacitor $v (CVE-2026-103922)"
          git push
