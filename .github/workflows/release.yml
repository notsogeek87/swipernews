name: Release APK (F-Droid RB)

# Le build de publication, et lui seul. À ne pas confondre avec android.yml, qui
# produit un APK à chaque push (version = numéro de run, pour que deux builds
# successifs s'installent l'un par-dessus l'autre).
#
# Ici, on compile EXACTEMENT comme F-Droid : Gradle nu, sans -PversionCode ni
# -PversionName, donc la version lue en clair dans android/app/build.gradle.
# C'est ce qui rend le build reproductible : F-Droid recompile le même tag,
# compare son APK au nôtre (signature exclue) et, s'ils coïncident, distribue
# le nôtre — signé de notre clé. Un paquet installé depuis GitHub se met alors
# à jour depuis F-Droid, et réciproquement.
#
# Toute divergence casse la vérification : ne rien injecter ici qui varie d'un
# build à l'autre (numéro de run, date, nom de branche…).
on:
  push:
    tags:
      - "v*.*.*" # les versions publiées ; android-v* est posé par android.yml
  # Rattrapage : un tag posé avant l'existence de ce fichier ne peut pas le
  # déclencher (Actions lit le workflow dans le ref choisi). Lancer alors le
  # workflow depuis main en donnant le tag à compiler.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à compiler et publier (ex. v1.2.0). Vide = le ref courant."
        required: false
        default: ""

permissions:
  contents: write # nécessaire pour publier la release qui porte l'APK

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Les sources compilées sont TOUJOURS celles du tag : le reste du
          # workflow (versions de Node/Java, commandes) vient du ref déclencheur.
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # plancher de la CLI Capacitor 8, qui refuse Node 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # exigé par Capacitor 8 / AGP 8.13
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Prépare le SDK Android
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Synchronise les assets web dans le projet natif
        run: npm run cap:sync

      # Le tag et la version en clair doivent dire la même chose : un tag posé
      # avant le commit qui bumpe build.gradle produirait un APK à l'ancienne
      # version, que F-Droid refuserait (et dont l'URL ne correspondrait pas).
      - name: Vérifie que le tag et build.gradle concordent
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          name="$(sed -n 's/^ *versionName "\(.*\)"$/\1/p' android/app/build.gradle)"
          code="$(sed -n 's/^ *versionCode \([0-9]*\)$/\1/p' android/app/build.gradle)"
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [ "${INPUT_TAG:-}" = "" ] && [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Ce workflow publie une version : le lancer sur un tag, ou renseigner l'entrée « tag »."
            exit 1
          fi
          if [ "$name" != "${tag#v}" ]; then
            echo "::error::Tag $tag mais versionName $name dans android/app/build.gradle."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Déchiffre la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Aucun secret ANDROID_KEYSTORE_BASE64 : une release doit être signée de la clé du projet (AllowedAPKSigningKeys côté F-Droid)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      # Gradle nu : aucune propriété -P, la version vient des sources.
      - name: Build APK
        id: build
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon
          apk="swipernews-${{ steps.version.outputs.name }}.apk"
          mv app/build/outputs/apk/release/app-release.apk "../$apk"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      # Le nom du fichier et le tag forment le contrat avec la recette F-Droid :
      #   Binaries: …/releases/download/v%v/swipernews-%v.apk
      # Les renommer casserait la vérification du build reproductible.
      - name: Publie la release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.build.outputs.apk }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          notes="APK signé de la clé du projet, produit par un Gradle nu depuis les sources du tag $TAG — donc bit pour bit celui que F-Droid recompile (build reproductible)."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "SwiperNews ${{ steps.version.outputs.name }}" \
              --notes "$notes"
          fi
          echo "### APK de publication : $APK ($TAG)" >> "$GITHUB_STEP_SUMMARY"
