# Audit ponctuel des failles (Trivy) — à supprimer après l'audit.
# Sécurité (CVE-2026-33634) : ni trivy-action ni setup-trivy ; binaire officiel
# v0.72.0 téléchargé depuis les releases GitHub, vérifié par somme SHA-256 ET
# par attestation de provenance (build par le workflow de release d'aquasecurity).
# Aucun secret du dépôt n'est utilisé.
name: audit-trivy
on:
  push:
    branches: ["security/audit-2026-11-11"]
    paths: [".github/workflows/audit-trivy.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TRIVY_VERSION: "0.72.0"
      JAVA_VERSION: "21"
      GRADLE_DIR: "android"
      USE_NODE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - if: env.USE_NODE == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: env.USE_NODE == 'true'
        name: Dépendances npm (sans scripts)
        continue-on-error: true
        run: |
          npm ci --ignore-scripts
          npm run cap:prepare || true
          npx cap sync android || true

      - if: env.GRADLE_DIR != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - if: env.GRADLE_DIR != ''
        name: Lockfile Gradle (dépendances livrées dans l'APK release)
        continue-on-error: true
        working-directory: ${{ env.GRADLE_DIR }}
        run: |
          cat > "$RUNNER_TEMP/lock.init.gradle" <<'EOF'
          allprojects {
            dependencyLocking { lockAllConfigurations() }
            tasks.register("resolveReleaseDeps") {
              doLast {
                configurations.findAll { it.canBeResolved && it.name ==~ /(?i).*releaseRuntimeClasspath/ }.each { it.resolve() }
              }
            }
          }
          EOF
          chmod +x gradlew
          ./gradlew --no-daemon -q --init-script "$RUNNER_TEMP/lock.init.gradle" \
            --no-configuration-cache --continue :app:dependencies --configuration releaseRuntimeClasspath --write-locks > /dev/null || true
          find . -name gradle.lockfile -not -path '*/node_modules/*' -exec wc -l {} \;

      - name: Installer Trivy (vérifié)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$TRIVY_VERSION" in 0.69.4|0.69.5|0.69.6) echo "::error::version compromise"; exit 1;; esac
          cd "$RUNNER_TEMP"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tgz="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "$base/$tgz"
          curl -fsSLO "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "trivy_${TRIVY_VERSION}_checksums.txt"
          gh attestation verify "$tgz" --repo aquasecurity/trivy
          tar xzf "$tgz" trivy
          ./trivy --version

      - name: Scan Trivy
        run: |
          T="$RUNNER_TEMP/trivy"
          $T fs --scanners vuln --skip-version-check --include-dev-deps --severity CRITICAL,HIGH,MEDIUM --format table . | tee trivy.txt
          $T fs --scanners vuln --skip-version-check --include-dev-deps --severity CRITICAL,HIGH,MEDIUM,LOW --format json --output trivy.json .
          echo "--- détail JSON compact :"
          jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? | [$t,.PkgName,.InstalledVersion,.Severity,.VulnerabilityID,(.FixedVersion//"-")] | @tsv' trivy.json
          echo "--- fichiers de dépendances vus :"
          jq -r '.Results[]? | "\(.Type)\t\(.Target)\t\(.Vulnerabilities|length? // 0)"' trivy.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: |
            trivy.json
            trivy.txt
            **/gradle.lockfile
            !**/node_modules/**
