# Brouillon de recette F-Droid pour SwiperNews (eu.lielu.news).
#
# Ce fichier n'est PAS lu par fdroidserver depuis ce dépôt : F-Droid construit
# ses métadonnées dans son propre dépôt, gitlab.com/fdroid/fdroiddata, sous
# metadata/eu.lielu.news.yml. Ce brouillon sert de base à copier/coller dans
# une merge request là-bas (voir fdroid/README.md pour la procédure).
#
# Rempli à partir de .github/workflows/android.yml, qui fait le même travail
# pour produire l'APK GitHub — la recette F-Droid doit rester équivalente,
# sans dépendre de GitHub Actions ni d'un token.

Categories:
  - News
  - Reading
License: MIT
AuthorName: lielu.eu
WebSite: https://news.lielu.eu
SourceCode: https://github.com/notsogeek87/swipernews
IssueTracker: https://github.com/notsogeek87/swipernews/issues
Changelog: https://github.com/notsogeek87/swipernews/releases

# Ni Name ni Description ici : F-Droid reprend le titre et les descriptions
# depuis fastlane/metadata/ du dépôt source, qui sont la version faisant foi.
# Les déclarer ici les figerait, et les deux textes divergeraient.
#
# AutoName, lui, n'est pas un choix : « fdroid checkupdates » le remplit tout
# seul depuis l'android:label de l'app, et leur CI échoue si le fichier n'est
# pas déjà dans l'état qu'elle produirait.
AutoName: SwiperNews

RepoType: git
Repo: https://github.com/notsogeek87/swipernews.git

# Build reproductible (« RB »). F-Droid recompile depuis les sources, télécharge
# l'APK publié ici et vérifie que les deux sont identiques (signature exclue) ;
# si oui, c'est NOTRE binaire, signé de NOTRE clé, qui est distribué. Un même
# paquet s'installe donc par-dessus l'autre, qu'il vienne de F-Droid ou de
# GitHub — impossible quand F-Droid resigne avec sa propre clé.
#
# %v est remplacé par le versionName. L'URL est celle que produit
# .github/workflows/release.yml sur un tag vX.Y.Z : ce workflow compile
# exactement comme F-Droid (Gradle nu, sans -PversionCode/-PversionName), sinon
# les deux APK divergeraient sur la version et la vérification échouerait.
Binaries: https://github.com/notsogeek87/swipernews/releases/download/v%v/swipernews-%v.apk
# Empreinte SHA-256 du certificat de signature (celui des secrets ANDROID_* du
# dépôt). F-Droid refuse tout APK signé d'une autre clé, ce qui protège contre
# une release GitHub contrefaite. Relevée sur l'APK publié :
#   apksigner verify --print-certs swipernews-X.Y.Z.apk
AllowedAPKSigningKeys: cc849a79fc39de5f8b4af5fcda1dbdb4230ad554aef85b484e5c7fd49caa6238

Builds:
  - versionName: "1.2.0"
    versionCode: 10200
    # Hash complet du commit à compiler, et non le tag `v1.2.0` : un tag peut
    # être déplacé, un hash non — F-Droid l'exige pour que la recette désigne
    # un arbre de sources immuable. (Ici, le commit du tag v1.2.0.)
    #
    # Le couple ci-dessus doit correspondre à ce que produit un Gradle nu à ce
    # commit : android/app/build.gradle porte les mêmes valeurs, écrites en
    # clair, faute de -PversionCode/-PversionName ici. Les deux se bougent
    # ensemble. Le versionCode suit la version (majeur × 10000 + mineur × 100
    # + correctif).
    commit: 4e5c98b10bff8fb3cf4ad7bfccfa70b1c03a522d
    subdir: android
    # Le nodejs de Debian est trop vieux : la CLI Capacitor 8 exige Node 22 et
    # refuse Node 20 (d'où le setup-node@22 d'android.yml). On passe donc par
    # le dépôt NodeSource, sinon cap sync s'arrête avant d'avoir rien recopié.
    sudo:
      - apt-get update
      - apt-get install -y curl ca-certificates
      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      - apt-get install -y nodejs
    # cap:sync régénère www/ (non versionné) puis le recopie dans le projet
    # natif : sans lui, l'APK embarque un assets/public vide.
    #
    # « init » s'exécute dans subdir, donc dans android/ — pas à la racine, où
    # vit le package.json. Ne pas ajouter de « cd .. » pour autant : npm remonte
    # tout seul jusqu'au package.json le plus proche, et la commande nue marche
    # donc depuis l'un comme depuis l'autre.
    init:
      - npm ci && npm run cap:sync
    gradle:
      - yes
    # Pas d'`output:` : ce champ ne sert qu'aux builds non-Gradle. Pour un build
    # Gradle, fdroidserver retrouve seul l'APK produit, et le déclarer n'aurait
    # servi qu'à figer un chemin que l'AGP peut renommer.
    #
    # F-Droid refuse tout binaire pré-compilé trouvé dans l'arbre des sources,
    # et npm ci en dépose quatorze dans node_modules. Aucun n'entre dans l'APK :
    # ce sont les outils de build de Capacitor (générateur d'icônes, analyseur
    # de build.gradle, gabarits de projet). On les désigne un par un plutôt que
    # d'ignorer node_modules en bloc — et il le faut, le scanner signalant aussi
    # bien un chemin inexistant qu'un chemin qui ne sert à rien.
    #
    # Ces cinq entrées disparaîtraient presque toutes en sortant @capacitor/
    # assets des devDependencies (il n'est utilisé que par npm run android:assets,
    # pour régénérer les icônes) : il apporte sharp, tsc et les JAR de trapezedev.
    scanignore:
      - node_modules/@capacitor/assets/node_modules/@capacitor/cli/assets
      - node_modules/@capacitor/cli/assets
      - node_modules/@trapezedev/gradle-parse
      - node_modules/@typescript/typescript-linux-x64
      - node_modules/sharp

# versionName et versionCode sont écrits en clair dans android/app/build.gradle,
# donc F-Droid sait les lire : une nouvelle entrée Builds s'ajoute toute seule à
# chaque tag de version, sans merge request. C'est ce qui oblige à garder ces
# valeurs littérales là-bas (voir le commentaire du fichier).
#
# « Version » tout court, sans le « v%v » d'antan : leur schéma ne l'accepte
# plus, fdroidserver déduit seul le motif du tag depuis UpdateCheckMode.
AutoUpdateMode: Version
# Restreint aux tags de version : le dépôt porte aussi des tags android-v*
# posés par la CI à chaque build, qui ne sont pas des versions publiées.
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: "1.2.0"
CurrentVersionCode: 10200
