<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Flux — actus en swipe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap');
  :root{
    --bg:#0a0a0f;--ink:#f5f3ef;--muted:#8a8a99;
    --accent:#ff3b6b;--accent-2:#4ad9ff;
    --sans:'Space Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);overscroll-behavior:none}

  #feed{height:100dvh;width:100%;overflow-y:scroll;scroll-snap-type:y mandatory;
    scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #feed::-webkit-scrollbar{display:none}

  .card{height:100dvh;width:100%;scroll-snap-align:start;scroll-snap-stop:always;
    position:relative;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
  .card__bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.08);filter:saturate(1.1)}
  .card__bg::after{content:"";position:absolute;inset:0;
    background:linear-gradient(to top,rgba(6,6,10,.96) 0%,rgba(6,6,10,.82) 28%,rgba(6,6,10,.25) 60%,rgba(6,6,10,.55) 100%)}
  .card__noimg{position:absolute;inset:0;
    background:radial-gradient(120% 80% at 20% 10%,rgba(255,59,107,.28),transparent 60%),
               radial-gradient(120% 80% at 90% 40%,rgba(74,217,255,.2),transparent 55%),var(--bg)}

  .card__body{position:relative;z-index:2;padding:28px 22px calc(44px + env(safe-area-inset-bottom))}
  .card__source{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;
    letter-spacing:.08em;text-transform:uppercase;color:var(--accent-2);margin-bottom:14px}
  .card__source .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 12px var(--accent-2)}
  .card__title{font-family:'Newsreader',serif;font-size:clamp(26px,7vw,40px);line-height:1.1;font-weight:500;letter-spacing:-.01em;margin-bottom:14px}
  .card__desc{font-size:15px;line-height:1.5;color:#d6d4cf;max-width:46ch;
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .card__meta{margin-top:16px;display:flex;align-items:center;gap:14px;color:var(--muted);font-size:13px}
  .card__open{margin-top:20px;display:inline-flex;align-items:center;gap:10px;
    background:var(--accent);color:#fff;border:none;font-family:var(--sans);font-weight:600;font-size:15px;
    padding:14px 22px;border-radius:100px;text-decoration:none;box-shadow:0 8px 30px rgba(255,59,107,.45);cursor:pointer}
  .card__open:active{transform:scale(.97)}

  .rail{position:absolute;right:16px;bottom:calc(120px + env(safe-area-inset-bottom));z-index:3;
    display:flex;flex-direction:column;gap:22px;align-items:center}
  .rail button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--ink);
    width:52px;height:52px;border-radius:50%;font-size:22px;cursor:pointer;backdrop-filter:blur(12px);
    display:grid;place-items:center;transition:transform .15s,background .2s}
  .rail button:active{transform:scale(.88)}
  .rail button.on{background:var(--accent);border-color:var(--accent)}

  .progress{position:fixed;left:0;top:0;height:100dvh;width:3px;z-index:20;pointer-events:none}
  .progress__bar{width:100%;background:linear-gradient(var(--accent),var(--accent-2));border-radius:0 3px 3px 0;transition:height .2s}

  .top{position:fixed;top:0;left:0;right:0;z-index:15;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;
    display:flex;flex-direction:column;gap:11px;background:linear-gradient(rgba(6,6,10,.82),rgba(6,6,10,.5) 65%,transparent)}
  .topline{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .brand{font-weight:700;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  .brand .mark{color:var(--accent)}
  .top .actions{display:flex;gap:8px}
  .top .actions button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--ink);
    padding:9px 14px;border-radius:100px;font-family:var(--sans);font-weight:600;font-size:13px;cursor:pointer;backdrop-filter:blur(12px)}
  .iconbtn{width:38px;height:38px;padding:0!important;display:grid;place-items:center;font-size:17px}

  /* Sélecteur de mode : deux onglets visibles, l'actif en surbrillance */
  .modeswitch{align-self:center;display:inline-flex;gap:4px;padding:4px;border-radius:100px;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(12px)}
  .modeswitch button{border:none;background:transparent;color:var(--muted);font-family:var(--sans);
    font-weight:600;font-size:13.5px;padding:8px 18px;border-radius:100px;cursor:pointer;
    display:flex;align-items:center;gap:7px;transition:background .2s,color .2s}
  .modeswitch button.active{background:rgba(255,255,255,.16);color:var(--ink);box-shadow:0 1px 8px rgba(0,0,0,.28)}
  .modeswitch button .ic{font-size:15px}

  /* Barre de catégories (mode Apprendre) : chips défilables horizontalement */
  .cats{display:none;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .cats::-webkit-scrollbar{display:none}
  body.learn .cats{display:flex}
  .cats button{flex:0 0 auto;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
    color:var(--muted);font-family:var(--sans);font-weight:600;font-size:13px;padding:7px 14px;border-radius:100px;
    cursor:pointer;white-space:nowrap;backdrop-filter:blur(12px);transition:background .2s,color .2s,border-color .2s}
  .cats button.active{background:rgba(74,217,255,.16);border-color:rgba(74,217,255,.5);color:#bff0ff}
  .cats .catedit{color:#7fe3ff;border-color:rgba(74,217,255,.3)}

  /* Sélecteur de centres d'intérêt (grille de chips à cocher) */
  .intgrid{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
  .intchip{background:#1a1a22;border:1px solid rgba(255,255,255,.12);color:var(--ink);
    font-family:var(--sans);font-weight:600;font-size:14px;padding:11px 16px;border-radius:100px;
    cursor:pointer;transition:background .15s,border-color .15s,color .15s}
  .intchip.on{background:rgba(74,217,255,.16);border-color:rgba(74,217,255,.55);color:#bff0ff}

  .demobadge{position:fixed;top:calc(116px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:14;
    background:rgba(74,217,255,.15);border:1px solid rgba(74,217,255,.35);color:var(--accent-2);
    padding:6px 14px;border-radius:100px;font-size:12px;font-weight:600}
  .demobadge.hidden{display:none}

  /* Mode Apprendre (Wikipédia) : bascule d'ambiance */
  body.learn{--accent:#4ad9ff;--accent-2:#ff8bb0}
  body.learn .brand .mark{transform:rotate(45deg);display:inline-block;transition:transform .3s}
  /* Mode Apprendre : on privilégie le texte — titre plus compact, description plus longue */
  body.learn .card__title{font-size:clamp(22px,5.6vw,32px);margin-bottom:10px}
  body.learn .card__desc{-webkit-line-clamp:10;font-size:15px;line-height:1.55;max-width:60ch;color:#e4e2dd}
  body.learn .card__body{padding-top:20px}

  .hint{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);
    z-index:14;color:var(--muted);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px;
    animation:float 1.8s ease-in-out infinite;pointer-events:none;opacity:.9}
  .hint .arrow{font-size:20px}
  @keyframes float{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-8px)}}

  .sheet{position:fixed;inset:0;z-index:50;background:rgba(6,6,10,.6);backdrop-filter:blur(6px);display:none;align-items:flex-end}
  .sheet.open{display:flex}
  .sheet__panel{background:#111117;width:100%;border-radius:24px 24px 0 0;padding:22px 20px calc(28px + env(safe-area-inset-bottom));
    max-height:82dvh;overflow-y:auto;border-top:1px solid rgba(255,255,255,.08)}
  .sheet__grip{width:44px;height:5px;border-radius:5px;background:rgba(255,255,255,.18);margin:0 auto 20px}
  .sheet h2{font-size:20px;margin-bottom:4px;letter-spacing:-.02em}
  .sheet p.sub{color:var(--muted);font-size:14px;margin-bottom:18px}
  .feedrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  .feedrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
  .feedrow .name{font-weight:600;font-size:15px}
  .feedrow .url{color:var(--muted);font-size:12px;word-break:break-all}
  .feedrow .del{margin-left:auto;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
  .addbox{display:flex;gap:8px;margin:18px 0 8px}
  .addbox input{flex:1;background:#1a1a22;border:1px solid rgba(255,255,255,.12);color:var(--ink);
    padding:13px 14px;border-radius:12px;font-family:var(--sans);font-size:14px}
  .addbox button,.applybtn{background:var(--accent);color:#fff;border:none;font-family:var(--sans);font-weight:600;
    padding:13px 18px;border-radius:12px;cursor:pointer;font-size:14px}
  .applybtn{width:100%;margin-top:16px;padding:15px;font-size:16px}
  .iorow{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08)}
  .iobtn{flex:1 1 auto;min-width:120px;background:#1a1a22;border:1px solid rgba(255,255,255,.12);color:var(--ink);
    font-family:var(--sans);font-weight:600;font-size:13px;padding:12px 14px;border-radius:12px;cursor:pointer}
  .iobtn:active{transform:scale(.97)}

  .state{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:40px;text-align:center;color:var(--muted)}
  .spinner{width:44px;height:44px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .state h3{color:var(--ink);font-size:18px}
  .hidden{display:none!important}
  .toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:#1a1a22;border:1px solid rgba(255,255,255,.12);color:var(--ink);padding:12px 20px;border-radius:100px;
    font-size:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}

  .sharemenu{position:fixed;inset:0;z-index:70;background:rgba(6,6,10,.6);backdrop-filter:blur(6px);
    display:flex;align-items:flex-end;opacity:0;transition:opacity .2s}
  .sharemenu.open{opacity:1}
  .sharemenu__panel{background:#111117;width:100%;border-radius:24px 24px 0 0;
    padding:22px 20px calc(28px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.08);
    transform:translateY(100%);transition:transform .25s}
  .sharemenu.open .sharemenu__panel{transform:translateY(0)}
  .sharemenu h2{font-size:20px;margin-bottom:4px;letter-spacing:-.02em}
  .sharemenu .sub{color:var(--muted);font-size:14px;margin-bottom:18px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .sharegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .sharedest{display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;
    background:#1a1a22;border:1px solid rgba(255,255,255,.12);color:var(--ink);font-family:var(--sans);
    font-weight:600;font-size:14px;padding:16px 12px;border-radius:14px;cursor:pointer}
  .sharedest:active{transform:scale(.97)}
</style>
</head>
<body>

<div class="progress"><div class="progress__bar" id="pbar"></div></div>

<header class="top">
  <div class="topline">
    <div class="brand"><span class="mark">◆</span> Flux</div>
    <div class="actions">
      <button id="installBtn" class="hidden" title="Installer l'app">⤓ Installer</button>
      <button id="reloadBtn" class="iconbtn" title="Rafraîchir les articles" aria-label="Rafraîchir">↻</button>
      <button id="openSheet" title="Gérer tes sources / réglages">⚙ Sources</button>
    </div>
  </div>
  <div class="modeswitch" role="tablist" aria-label="Choix du mode">
    <button id="tabNews" class="active" role="tab"><span class="ic">📰</span> Actus</button>
    <button id="tabLearn" role="tab"><span class="ic">🎓</span> Apprendre</button>
  </div>
  <div class="cats" id="cats" aria-label="Centres d'intérêt"></div>
</header>

<div class="demobadge hidden" id="demobadge">Mode démo — hors-ligne</div>

<div id="feed"></div>

<div class="hint" id="hint"><span class="arrow">⌃</span><span>Swipe</span></div>

<div class="state hidden" id="loading">
  <div class="spinner"></div>
  <p>Chargement des actus…</p>
</div>

<div class="state hidden" id="empty">
  <h3 id="emptyTitle">Aucun article</h3>
  <p id="emptyMsg"></p>
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:340px">
    <button class="iobtn" onclick="loadFeeds()">↻ Réessayer</button>
    <button class="iobtn" onclick="document.getElementById('openSheet').click()">Ouvrir les sources</button>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet__panel">
    <div class="sheet__grip"></div>
    <h2>Tes sources</h2>
    <p class="sub">Coche les flux à afficher, ajoute ceux que tu veux.</p>
    <div id="feedList"></div>
    <div class="addbox">
      <input id="newUrl" type="url" placeholder="https://exemple.com/rss" inputmode="url">
      <button onclick="addFeed()">Ajouter</button>
    </div>

    <div class="iorow">
      <button class="iobtn" onclick="exportFeeds('opml')">↓ Exporter (OPML)</button>
      <button class="iobtn" onclick="exportFeeds('json')">↓ Exporter (JSON)</button>
      <button class="iobtn" onclick="document.getElementById('importFile').click()">↑ Importer un fichier</button>
    </div>
    <input id="importFile" type="file" accept=".opml,.xml,.json,application/json,text/xml" style="display:none" onchange="importFromFile(event)">

    <button class="applybtn" onclick="applyAndClose()">Voir mon fil</button>
  </div>
</div>

<div class="sheet" id="intSheet">
  <div class="sheet__panel">
    <div class="sheet__grip"></div>
    <h2>Tes centres d'intérêt</h2>
    <p class="sub">Choisis ce que tu veux apprendre. Tu pourras les modifier à tout moment.</p>
    <div class="intgrid" id="intGrid"></div>
    <button class="applybtn" onclick="saveInterests()">Valider</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- Articles Wikipédia de démo (repli hors-ligne du mode Apprendre) ---------- */
const DEMO_LEARN = [
  {source:"Wikipédia", title:"Effet tunnel", desc:"En mécanique quantique, l'effet tunnel désigne la capacité d'une particule à franchir une barrière de potentiel qu'elle ne pourrait pas surmonter selon les lois de la physique classique. Ce comportement découle de la nature ondulatoire de la matière : la fonction d'onde de la particule ne s'annule pas brutalement à la barrière, mais décroît, laissant une probabilité non nulle de la retrouver de l'autre côté. Le phénomène est essentiel à la fusion nucléaire au cœur du Soleil, où il permet aux protons de se rapprocher malgré leur répulsion. Il est aussi exploité par le microscope à effet tunnel, capable d'imager des surfaces atome par atome, et par certains composants électroniques comme la diode tunnel.", date:"", img:"https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1200&q=70", link:"https://fr.wikipedia.org/wiki/Effet_tunnel"},
  {source:"Wikipédia", title:"Bibliothèque d'Alexandrie", desc:"Fondée au IIIe siècle av. J.-C. sous la dynastie des Ptolémées, la bibliothèque d'Alexandrie fut l'une des plus grandes bibliothèques de l'Antiquité et un foyer majeur du savoir hellénistique. Elle rassemblait des centaines de milliers de rouleaux de papyrus et attirait savants, poètes et scientifiques de tout le bassin méditerranéen. On y aurait copié systématiquement les ouvrages des navires accostant au port. Son déclin, étalé sur plusieurs siècles, reste entouré de récits contradictoires, et elle demeure un symbole durable de la connaissance perdue.", date:"", img:"https://images.unsplash.com/photo-1507842217343-583bb7270b66?w=1200&q=70", link:"https://fr.wikipedia.org/wiki/Biblioth%C3%A8que_d%27Alexandrie"},
  {source:"Wikipédia", title:"Tardigrade", desc:"Surnommé « ourson d'eau », le tardigrade est un micro-animal de moins d'un millimètre réputé pour sa résistance hors du commun. Il peut survivre à des conditions extrêmes : vide spatial, radiations intenses, pressions énormes, dessiccation quasi totale et températures proches du zéro absolu. Pour cela, il entre dans un état de vie ralentie appelé cryptobiose, dans lequel son métabolisme devient presque indétectable. Une fois réhydraté, il reprend son activité comme si de rien n'était. On en trouve partout, des fonds océaniques aux mousses de nos jardins.", date:"", img:"https://images.unsplash.com/photo-1439405326854-014607f694d7?w=1200&q=70", link:"https://fr.wikipedia.org/wiki/Tardigrada"},
  {source:"Wikipédia", title:"Nombre d'or", desc:"Le nombre d'or, noté φ et valant environ 1,618, est le rapport entre deux longueurs telles que le tout est au plus grand ce que le plus grand est au plus petit. On le retrouve en géométrie, notamment dans le pentagone régulier, et il est intimement lié à la suite de Fibonacci, dont le rapport de deux termes successifs tend vers φ. Depuis l'Antiquité, il a nourri de nombreuses spéculations esthétiques en art et en architecture, parfois exagérées. Il apparaît aussi dans certaines proportions naturelles, comme la disposition des graines de tournesol.", date:"", img:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1200&q=70", link:"https://fr.wikipedia.org/wiki/Nombre_d%27or"},
  {source:"Wikipédia", title:"Aurore polaire", desc:"Une aurore polaire est un phénomène lumineux des hautes latitudes, appelé aurore boréale dans l'hémisphère nord et aurore australe dans le sud. Elle naît de l'interaction entre les particules chargées du vent solaire et les gaz de la haute atmosphère, guidées par le champ magnétique terrestre vers les régions polaires. Les collisions excitent les atomes d'oxygène et d'azote, qui réémettent de la lumière en retombant à leur état d'énergie normal. La couleur dépend du gaz et de l'altitude : vert pour l'oxygène à basse altitude, rouge plus haut, bleu et violet pour l'azote. L'intensité des aurores suit le cycle d'activité du Soleil.", date:"", img:"https://images.unsplash.com/photo-1483347756197-71ef80e95f73?w=1200&q=70", link:"https://fr.wikipedia.org/wiki/Aurore_polaire"},
];

/* ---------- Sources ---------- */
const DEFAULT_FEEDS = [
  {name:"France Info", url:"https://www.francetvinfo.fr/titres.rss", on:true},
];
const LS_KEY="fluxswipe.feeds.v1";
const LS_MODE="fluxswipe.mode.v1";
const LS_CAT="fluxswipe.cat.v1";
const LS_INT="fluxswipe.interests.v1";
let feeds=load(),items=[],liked=new Set();
let mode=(()=>{try{return localStorage.getItem(LS_MODE)==="learn"?"learn":"news";}catch(e){return "news";}})();

/* Centres d'intérêt (mode Apprendre). q = requête de recherche Wikipédia ; null = purement aléatoire.
   deepcategory:"X" cible les articles de la catégorie X et de ses sous-catégories. */
const CATEGORIES=[
  {key:"random",   label:"🎲 Aléatoire",     q:null},
  {key:"sciences", label:"🔬 Sciences",      q:'deepcategory:"Sciences"'},
  {key:"histoire", label:"📜 Histoire",      q:'deepcategory:"Histoire"'},
  {key:"art",      label:"🎨 Art & Culture", q:'deepcategory:"Arts"'},
  {key:"geo",      label:"🌍 Géographie",    q:'deepcategory:"Géographie"'},
  {key:"nature",   label:"🐾 Nature",        q:'deepcategory:"Nature"'},
  {key:"espace",   label:"🌌 Espace",        q:'deepcategory:"Astronomie"'},
  {key:"tech",     label:"💻 Technologie",   q:'deepcategory:"Technologie"'},
  {key:"sport",    label:"⚽ Sport",         q:'deepcategory:"Sport"'},
  {key:"cinema",   label:"🎬 Cinéma",        q:'deepcategory:"Cinéma"'},
  {key:"musique",  label:"🎵 Musique",       q:'deepcategory:"Musique"'},
  {key:"philo",    label:"🧠 Philosophie",   q:'deepcategory:"Philosophie"'},
];
/* Intérêts choisis par l'utilisateur (sous-ensemble de clés CATEGORIES, hors "random"). */
let interests=(()=>{try{const s=localStorage.getItem(LS_INT);return s?JSON.parse(s):[];}catch(e){return [];}})();
function interestsChosen(){try{return localStorage.getItem(LS_INT)!==null;}catch(e){return false;}}
/* Filtre courant : "all" = mélange des intérêts choisis, sinon une clé d'intérêt précise. */
let cat=(()=>{try{const v=localStorage.getItem(LS_CAT);return (v&&v!=="random")?v:"all";}catch(e){return "all";}})();
/* Catégorie effective pour un lot : le filtre courant, ou un intérêt tiré au sort si "all". */
function activeCatKey(){
  if(cat!=="all")return cat;
  if(interests.length)return interests[Math.floor(Math.random()*interests.length)];
  return "random";
}

function load(){try{const s=localStorage.getItem(LS_KEY);if(s)return JSON.parse(s);}catch(e){}return structuredClone(DEFAULT_FEEDS);}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(feeds));}catch(e){}}

/* ---------- Récupération avec plusieurs proxys de secours ---------- */
const PROXIES=[
  u=>"/api/feed?url="+encodeURIComponent(u),                       // backend same-origin (Vercel) : fiable, aucun CORS
  u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),
  u=>"https://corsproxy.io/?url="+encodeURIComponent(u),
  u=>"https://api.codetabs.com/v1/proxy/?quest="+encodeURIComponent(u),
  u=>"https://thingproxy.freeboard.io/fetch/"+u,
  u=>"https://api.allorigins.win/get?url="+encodeURIComponent(u), // renvoie {contents,status}
];
async function fetchViaProxy(make,url,timeout){
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),timeout);
  try{
    const res=await fetch(make(url),{cache:"no-store",signal:ctl.signal});
    if(!res.ok)throw new Error("http");
    let txt=await res.text();
    // dé-emballe le format allorigins /get : {contents:"…",status:{http_code}}
    if(txt&&txt.startsWith("{")&&txt.includes('"contents"')&&txt.includes('"http_code"')){
      try{const j=JSON.parse(txt);if(j&&typeof j.contents==="string")txt=j.contents;}catch(_){}
    }
    if(txt&&txt.length>200)return txt;
    throw new Error("empty");
  }finally{clearTimeout(t);}
}
async function fetchText(url){
  // 1) backend same-origin d'abord (rapide et fiable sur Vercel)
  try{return await fetchViaProxy(PROXIES[0],url,7000);}catch(e){}
  // 2) sinon on lance TOUS les proxys en parallèle et on garde le premier qui répond
  try{return await Promise.any(PROXIES.slice(1).map(m=>fetchViaProxy(m,url,7000)));}catch(e){}
  throw new Error("no-proxy");
}
/* rss2json : service dédié qui parse le flux côté serveur et renvoie du JSON (CORS ok) */
async function fetchFeedRss2Json(feed){
  const api="https://api.rss2json.com/v1/api.json?count=60&rss_url="+encodeURIComponent(feed.url);
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),7000);
  const res=await fetch(api,{cache:"no-store",signal:ctl.signal});
  clearTimeout(t);
  if(!res.ok)throw new Error("http");
  const data=await res.json();
  if(!data||data.status!=="ok"||!Array.isArray(data.items))throw new Error("bad");
  return data.items.map(it=>({
    source:feed.name,title:(it.title||"").trim(),
    desc:stripHtml(it.description||it.content||""),link:it.link||"",
    img:it.thumbnail||(it.enclosure&&it.enclosure.link)||imgFromHtml(it.content||it.description||""),
    date:it.pubDate||""
  })).filter(i=>i.title);
}
/* Récupération robuste d'un flux : backend/proxys + XML d'abord, puis repli rss2json */
async function fetchFeedRobust(feed){
  try{const a=await fetchFeed(feed);if(a.length)return a;}catch(e){/* repli rss2json */}
  return await fetchFeedRss2Json(feed);
}
async function fetchFeed(feed){
  const text=await fetchText(feed.url);
  const doc=new DOMParser().parseFromString(text,"text/xml");
  const nodes=[...doc.querySelectorAll("item, entry")];
  return nodes.map(n=>{
    const get=sel=>n.querySelector(sel)?.textContent?.trim()||"";
    let link=get("link");if(!link){const l=n.querySelector("link");link=l?.getAttribute("href")||"";}
    const raw=get("description")||get("summary")||get("content");
    return {source:feed.name,title:get("title"),desc:stripHtml(raw),link,img:findImage(n,raw),
      date:get("pubDate")||get("published")||get("updated")};
  }).filter(i=>i.title);
}
function stripHtml(html){const d=document.createElement("div");d.innerHTML=html;return (d.textContent||"").replace(/\s+/g," ").trim();}
function imgFromHtml(html){const g=html&&html.match(/<img[^>]+src=["']([^"']+)["']/i);return g?g[1]:"";}
function findImage(node,raw){
  const m=node.querySelector("enclosure[url], content[url], thumbnail, [medium='image']");
  if(m){const u=m.getAttribute("url");if(u)return u;}
  return imgFromHtml(raw);
}
function relTime(dateStr){const t=Date.parse(dateStr);if(isNaN(t))return "";
  const d=(Date.now()-t)/1000;if(d<3600)return Math.max(1,Math.round(d/60))+" min";
  if(d<86400)return Math.round(d/3600)+" h";return Math.round(d/86400)+" j";}

/* ---------- Mode Apprendre : articles Wikipédia aléatoires ---------- */
const WIKI_LANG="fr";
/* Un lot d'articles au hasard, via l'API action (extraits longs + image + URL, en un appel). */
async function fetchWikiBatch(){
  const c=CATEGORIES.find(x=>x.key===activeCatKey())||CATEGORIES[0];
  const params=new URLSearchParams({
    action:"query",format:"json",origin:"*",
    prop:"extracts|pageimages|info",
    explaintext:"1",exintro:"1",exlimit:"20",            // exintro (pas exsentences, incompatible avec exlimit>1) + exlimit=20 : un extrait pour CHAQUE article
    piprop:"thumbnail|original",pithumbsize:"1200",pilimit:"20",inprop:"url"
  });
  if(c.q){                                               // catégorie : recherche triée au hasard
    params.set("generator","search");params.set("gsrsearch",c.q);
    params.set("gsrsort","random");params.set("gsrnamespace","0");params.set("gsrlimit","20");
  }else{                                                 // Aléatoire pur
    params.set("generator","random");params.set("grnnamespace","0");params.set("grnlimit","20");
  }
  const url=`https://${WIKI_LANG}.wikipedia.org/w/api.php?${params}`;
  let data;
  try{
    const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),7000);
    const res=await fetch(url,{cache:"no-store",signal:ctl.signal});
    clearTimeout(t);
    if(!res.ok)throw new Error("http");
    data=await res.json();
  }catch(e){
    data=JSON.parse(await fetchText(url));               // repli via proxys si le direct échoue
  }
  return data&&data.query&&data.query.pages?Object.values(data.query.pages):[];
}
async function fetchWikipedia(count=30,batchCount=2){
  const batches=await Promise.allSettled(Array.from({length:batchCount},fetchWikiBatch));
  const seen=new Set(),out=[];
  for(const b of batches){
    if(b.status!=="fulfilled")continue;
    for(const p of b.value){
      const title=p.title||"";
      const desc=(p.extract||"").replace(/\s+/g," ").trim();
      if(!title||seen.has(title)||desc.length<120)continue; // écarte ébauches / homonymies
      seen.add(title);
      out.push({source:"Wikipédia",title,desc,
        link:p.canonicalurl||p.fullurl||"",
        img:(p.original&&p.original.source)||(p.thumbnail&&p.thumbnail.source)||"",date:""});
    }
  }
  out.sort((a,b)=>(b.img?1:0)-(a.img?1:0));               // les articles avec image d'abord
  return out.slice(0,count);
}

/* ---------- Cache local : affichage instantané au lancement ---------- */
const LS_CACHE="fluxswipe.cache.v1";
function cacheSave(m){try{const all=JSON.parse(localStorage.getItem(LS_CACHE)||"{}");
  all[m]={t:Date.now(),items:items.slice(0,40)};localStorage.setItem(LS_CACHE,JSON.stringify(all));}catch(e){}}
function cacheLoad(m){try{const e=(JSON.parse(localStorage.getItem(LS_CACHE)||"{}"))[m];
  if(e&&Array.isArray(e.items)&&e.items.length)return e.items;}catch(e){}return null;}

/* ---------- Chargement principal ---------- */
async function loadFeeds(){
  demobadge(false);
  const m=mode;                                   // capture : l'utilisateur peut changer de mode pendant le fetch
  const key=m==="learn"?("learn_"+cat):"news";    // cache distinct par catégorie
  const cached=cacheLoad(key);
  if(cached){items=cached;render();hideStates();}  // peinture immédiate depuis le cache
  else show("loading");

  if(m==="learn"){
    try{
      const arr=await fetchWikipedia(20,1);        // un seul lot au démarrage → rapide ; le scroll infini complète
      if(!arr.length)throw new Error("empty");
      if(mode!==m||cat!==(key.slice(6)))return;    // catégorie changée entre-temps → on abandonne
      items=arr;render(cached&&feedEl.scrollTop>50);hideStates();cacheSave(key);
    }catch(e){
      if(mode!==m||cached)return;                  // si on a déjà le cache, on le garde
      items=structuredClone(DEMO_LEARN);demobadge(true);render();hideStates();
    }
    return;
  }

  const active=feeds.filter(f=>f.on);
  if(!active.length){if(!cached){items=[];render();showEmpty("no-feeds");}return;}
  try{
    const results=await Promise.allSettled(active.map(fetchFeedRobust));
    if(mode!==m)return;
    let all=[];const failed=[];
    results.forEach((r,i)=>{
      if(r.status==="fulfilled"&&r.value.length)all=all.concat(r.value);
      else failed.push(active[i].name);
    });
    if(!all.length)throw new Error("no-items");
    all.sort((a,b)=>(Date.parse(b.date)||0)-(Date.parse(a.date)||0));
    items=all.slice(0,120);
    render(cached&&feedEl.scrollTop>50);hideStates();cacheSave(key);
    if(failed.length)toast(`${failed.length} flux injoignable${failed.length>1?"s":""}`);
  }catch(e){
    if(mode!==m)return;
    if(cached)toast("Réseau indisponible — affichage du cache");
    else{items=[];render();showEmpty("all-failed");}
  }
}

function appendCards(newItems,start){

async function loadMoreLearn(){

  loadingMore=true;
  try{
    const more=await fetchWikipedia(20,1);

    if(fresh.length){const start=items.length;items=items.concat(fresh);appendCards(fresh,start);}

function cardHTML(it,i){
  const bg=it.img?`<div class="card__bg" style="background-image:url('${escAttr(it.img)}')"></div>`:`<div class="card__noimg"></div>`;
  const hasLink=it.link&&it.link!=="#";
  const openLabel=it.source==="Wikipédia"?"Lire sur Wikipédia →":"Lire l'article →";
  return `<article class="card" data-i="${i}">
    ${bg}
    <div class="rail">
      <button class="likeBtn" data-i="${i}">♥</button>
      <button class="shareBtn" data-i="${i}">↗</button>
    </div>
    <div class="card__body">
      <span class="card__source"><span class="dot"></span>${esc(it.source)}</span>
      <h1 class="card__title">${esc(it.title)}</h1>
      ${it.desc?`<p class="card__desc">${esc(it.desc)}</p>`:""}
      <div class="card__meta">${it.date?`<span>${relTime(it.date)}</span>`:""}</div>
      ${hasLink?`<a class="card__open" href="${escAttr(it.link)}" target="_blank" rel="noopener">${openLabel}</a>`:`<span class="card__open" style="background:rgba(255,255,255,.1);box-shadow:none">Article de démo</span>`}
    </div>
  </article>`;
}
function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function escAttr(s){return (s||"").replace(/["'&<>]/g,c=>({'"':"&quot;","'":"&#39;","&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function attachRail(){
  document.querySelectorAll(".likeBtn").forEach(b=>b.onclick=e=>{e.stopPropagation();
    if(liked.has(+b.dataset.i)){liked.delete(+b.dataset.i);b.classList.remove("on");}
    else{liked.add(+b.dataset.i);b.classList.add("on");toast("Ajouté aux favoris");}});
  document.querySelectorAll(".shareBtn").forEach(b=>b.onclick=async e=>{e.stopPropagation();
    shareItem(items[+b.dataset.i]);});
}

async function shareItem(it){
  const url=it.link&&it.link!=="#"?it.link:location.href;
  const shareData={title:it.title,text:it.title,url};
  // 1) partage natif (ouvre la feuille de partage du téléphone : Messages, WhatsApp, Mail…)
  if(navigator.share){
    try{await navigator.share(shareData);return;}catch(err){if(err&&err.name==="AbortError")return;}
  }
  // 2) repli : menu maison avec destinations courantes
  openShareMenu(it,url);
}

/* Menu de partage de repli (desktop ou si le partage natif est absent) */
function openShareMenu(it,url){
  const enc=encodeURIComponent, t=enc(it.title), u=enc(url);
  const targets=[
    {label:"WhatsApp", href:`https://wa.me/?text=${t}%20${u}`},
    {label:"Telegram", href:`https://t.me/share/url?url=${u}&text=${t}`},
    {label:"E-mail",   href:`mailto:?subject=${t}&body=${t}%0A${u}`},
    {label:"X (Twitter)", href:`https://twitter.com/intent/tweet?text=${t}&url=${u}`},
    {label:"Facebook", href:`https://www.facebook.com/sharer/sharer.php?u=${u}`},
  ];
  const back=document.createElement("div");
  back.className="sharemenu";
  back.innerHTML=`<div class="sharemenu__panel">
    <div class="sheet__grip"></div>
    <h2>Partager</h2>
    <p class="sub">${esc(it.title)}</p>
    <div class="sharegrid">
      ${targets.map(x=>`<a class="sharedest" href="${escAttr(x.href)}" target="_blank" rel="noopener">${x.label}</a>`).join("")}
      <button class="sharedest" id="copyLink">Copier le lien</button>
    </div>
  </div>`;
  document.body.appendChild(back);
  requestAnimationFrame(()=>back.classList.add("open"));
  const close=()=>{back.classList.remove("open");setTimeout(()=>back.remove(),200);};
  back.onclick=e=>{if(e.target===back)close();};
  back.querySelectorAll("a.sharedest").forEach(a=>a.addEventListener("click",close));
  back.querySelector("#copyLink").onclick=async()=>{
    try{await navigator.clipboard.writeText(url);toast("Lien copié");}catch(_){toast("Copie impossible");}
    close();
  };
}

/* ---------- Import / Export des sources ---------- */
function download(filename,content,mime){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportFeeds(format){
  if(!feeds.length){toast("Aucune source à exporter");return;}
  const stamp=new Date().toISOString().slice(0,10);
  if(format==="json"){
    download(`flux-sources-${stamp}.json`,JSON.stringify(feeds,null,2),"application/json");
  }else{
    const rows=feeds.map(f=>
      `    <outline type="rss" text="${escAttr(f.name)}" title="${escAttr(f.name)}" xmlUrl="${escAttr(f.url)}"/>`
    ).join("\n");
    const opml=`<?xml version="1.0" encoding="UTF-8"?>
<opml version="2.0">
  <head><title>Flux — mes sources</title></head>
  <body>
${rows}
  </body>
</opml>`;
    download(`flux-sources-${stamp}.opml`,opml,"text/xml");
  }
  toast("Sources exportées");
}
function importFromFile(ev){
  const file=ev.target.files&&ev.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const text=String(reader.result||"");
      const parsed=text.trim().startsWith("{")||text.trim().startsWith("[")
        ? parseJsonFeeds(text) : parseOpmlFeeds(text);
      if(!parsed.length){toast("Aucune source trouvée dans le fichier");return;}
      mergeFeeds(parsed);
    }catch(e){toast("Fichier illisible");}
    finally{ev.target.value="";}
  };
  reader.readAsText(file);
}
function parseJsonFeeds(text){
  const data=JSON.parse(text);
  const arr=Array.isArray(data)?data:(data.feeds||[]);
  return arr.filter(f=>f&&f.url).map(f=>({
    name:f.name||hostOf(f.url),url:String(f.url),on:f.on!==false
  }));
}
function parseOpmlFeeds(text){
  const doc=new DOMParser().parseFromString(text,"text/xml");
  return [...doc.querySelectorAll("outline[xmlUrl]")].map(o=>{
    const url=o.getAttribute("xmlUrl");
    const name=o.getAttribute("text")||o.getAttribute("title")||hostOf(url);
    return {name,url,on:true};
  }).filter(f=>f.url);
}
function hostOf(url){try{return new URL(url).hostname.replace("www.","");}catch(_){return url;}}
function mergeFeeds(incoming){
  const existing=new Set(feeds.map(f=>f.url));
  let added=0;
  incoming.forEach(f=>{if(!existing.has(f.url)){feeds.push(f);existing.add(f.url);added++;}});
  save();renderList();
  toast(added? `${added} source${added>1?"s":""} importée${added>1?"s":""}` : "Sources déjà présentes");
}

  document.getElementById("empty").classList.remove("hidden");
}
function demobadge(on){document.getElementById("demobadge").classList.toggle("hidden",!on);}
let toastT;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1800);}

loadFeeds();
</script>

<script>
/* ---------- PWA : rendre l'app installable (fichier unique) ---------- */
(function setupPWA(){
  const svgIcon = size => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 512 512">
    <rect width="512" height="512" rx="112" fill="#0a0a0f"/>
    <path d="M256 96 L400 256 L256 416 L112 256 Z" fill="#ff3b6b"/>
    <circle cx="256" cy="256" r="46" fill="#4ad9ff"/></svg>`;
  const iconUrl = size => "data:image/svg+xml;base64," + btoa(svgIcon(size));

  const manifest = {
    name:"Flux — actus en swipe", short_name:"Flux",
    description:"Tes actualités RSS en mode swipe.",
    start_url:".", scope:".", display:"standalone",
    background_color:"#0a0a0f", theme_color:"#0a0a0f", orientation:"portrait",
    icons:[
      {src:iconUrl(192),sizes:"192x192",type:"image/svg+xml",purpose:"any maskable"},
      {src:iconUrl(512),sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}
    ]
  };
  const mBlob=new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"});
  const link=document.createElement("link");
  link.rel="manifest";link.href=URL.createObjectURL(mBlob);
  document.head.appendChild(link);

  const theme=document.createElement("meta");theme.name="theme-color";theme.content="#0a0a0f";document.head.appendChild(theme);
  const applecap=document.createElement("meta");applecap.name="apple-mobile-web-app-capable";applecap.content="yes";document.head.appendChild(applecap);
  const appleIcon=document.createElement("link");appleIcon.rel="apple-touch-icon";appleIcon.href=iconUrl(192);document.head.appendChild(appleIcon);

  if("serviceWorker" in navigator){
    const swCode=`
      const CACHE="flux-v1";
      self.addEventListener("install",e=>self.skipWaiting());
      self.addEventListener("activate",e=>e.waitUntil(self.clients.claim()));
      self.addEventListener("fetch",e=>{
        if(e.request.method!=="GET")return;
        e.respondWith(caches.open(CACHE).then(c=>
          fetch(e.request).then(r=>{c.put(e.request,r.clone());return r;}).catch(()=>c.match(e.request))));
      });`;
    const swUrl=URL.createObjectURL(new Blob([swCode],{type:"text/javascript"}));
    navigator.serviceWorker.register(swUrl).catch(()=>{});
  }

  let deferred=null;
  const btn=document.getElementById("installBtn");
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;btn.classList.remove("hidden");});
  btn.onclick=async()=>{
    if(!deferred){showIosHint();return;}
    deferred.prompt();await deferred.userChoice;deferred=null;btn.classList.add("hidden");
  };
  window.addEventListener("appinstalled",()=>btn.classList.add("hidden"));

  const isIos=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone=window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone;
  if(isIos && !standalone){btn.classList.remove("hidden");}
  function showIosHint(){
    if(isIos)toast("Appuie sur Partager puis « Sur l'écran d'accueil »");
    else toast("Installation non disponible sur ce navigateur");
  }
})();
</script>
