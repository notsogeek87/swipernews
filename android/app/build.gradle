apply plugin: 'com.android.application'

// Clé de signature fournie par la CI depuis les secrets du dépôt. Absente en
// local : Gradle retombe alors sur la clé debug.
def releaseKeystore = System.getenv('ANDROID_KEYSTORE_FILE')
def hasReleaseKeystore = releaseKeystore && file(releaseKeystore).exists()

android {
    namespace = "eu.lielu.news"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "eu.lielu.news"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // La version de l'app, écrite en clair et NON en variable Groovy : c'est
        // la seule forme que sait lire l'analyseur de F-Droid (fdroidserver,
        // common.py, vcsearch_g/vnsearch_g — un littéral, rien d'autre). Sans
        // ça, « fdroid checkupdates » ne trouve aucune version et abandonne.
        //
        // Ces deux valeurs sont donc la version publiée, à aligner avec le tag
        // git et la recette (fdroid/eu.lielu.news.yml) — voir fdroid/README.md.
        //
        // Le versionCode se déduit de la version :
        //     majeur × 10⁸ + mineur × 10⁶ + correctif × 10⁴ + build
        // soit 103020000 pour 1.3.2, le champ « build » restant à zéro ici.
        // Il croît donc sans compteur à tenir.
        //
        // Ces quatre chiffres de queue ne sont pas décoratifs : android.yml y
        // loge le numéro de run, SOUS le palier (103020000 − 10000 + 77 =
        // 103010077 pour le build 77). Un APK de main est donc une préversion
        // de la version préparée ici, numérotée entre le tag précédent et
        // celui à venir — voir le tableau dans android.yml.
        //
        // Avant cet élargissement, les builds CI portaient le numéro de run nu :
        // 76 face au 10301 du tag v1.3.1. Pour Android c'était une
        // rétrogradation, et un APK de main refusait de s'installer par-dessus
        // une version publiée. Le prix de la correction est une inflation
        // irréversible du versionCode, qui ne redescend jamais.
        versionCode 104010000
        versionName "1.4.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Sans ça, l'AGP glisse dans le bloc de signature de l'APK la liste chiffrée
    // de nos dépendances, destinée à Google Play. F-Droid la refuse (« found
    // extra signing block 'Dependency metadata' ») et son scanner rejette le
    // paquet. Ce bloc n'apparaît que lorsque Gradle signe lui-même : d'où son
    // absence dans l'APK non signé que compile F-Droid, et sa présence dans
    // celui de notre CI, le seul des deux qui soit publié.
    //
    // À déclarer ici, dans « android », et non dans « defaultConfig » : Gradle
    // ne connaît pas la méthode là-bas.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// La CI (.github/workflows/android.yml) écrase la version ci-dessus par le
// numéro de run, pour qu'un APK GitHub s'installe par-dessus le précédent.
// Écrit ici, après le bloc android, et non dans defaultConfig : là-haut, une
// expression Groovy rendrait la version illisible pour F-Droid, qui compile
// sans ces propriétés et exige un littéral.
if (project.hasProperty('versionCode')) {
    android.defaultConfig.versionCode = project.property('versionCode') as Integer
}
if (project.hasProperty('versionName')) {
    android.defaultConfig.versionName = project.property('versionName')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // FileProvider, pour passer le fichier d'export à la feuille de partage
    // (InAppBrowserPlugin.saveFile). La version est celle que Capacitor déclare
    // déjà (variables.gradle) : rien de neuf n'entre dans le paquet, on rend
    // seulement la dépendance explicite plutôt que transitive.
    implementation "androidx.core:core:$androidxCoreVersion"
    // Navigateur intégré : WebSettingsCompat.setAlgorithmicDarkeningAllowed, pour
    // que les articles s'affichent en sombre comme le reste de l'app. La version
    // est celle que Capacitor déclare déjà (variables.gradle) — aucune
    // bibliothèque nouvelle n'entre dans le paquet, capacitor-android l'embarque
    // déjà ; on la remonte simplement sur le classpath du module app.
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
