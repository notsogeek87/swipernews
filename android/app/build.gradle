apply plugin: 'com.android.application'
// Voix neuronale hors ligne : récupère les bibliothèques natives de sherpa-onnx.
apply from: 'sherpa.gradle'

// Clé de signature fournie par la CI depuis les secrets du dépôt. Absente en
// local : Gradle retombe alors sur la clé debug.
def releaseKeystore = System.getenv('ANDROID_KEYSTORE_FILE')
def hasReleaseKeystore = releaseKeystore && file(releaseKeystore).exists()

android {
    namespace = "eu.lielu.news"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "eu.lielu.news"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // La version de l'app, écrite en clair et NON en variable Groovy : la CI
        // (android.yml, release.yml) la relit avec sed, un littéral et rien
        // d'autre.
        //
        // Ces deux valeurs sont donc la version publiée, à aligner avec le tag
        // git.
        //
        // Le versionCode se déduit de la version :
        //     majeur × 10⁸ + mineur × 10⁶ + correctif × 10⁴ + build
        // soit 103020000 pour 1.3.2, le champ « build » restant à zéro ici.
        // Il croît donc sans compteur à tenir.
        //
        // Ces quatre chiffres de queue ne sont pas décoratifs : android.yml y
        // loge le numéro de run, SOUS le palier (103020000 − 10000 + 77 =
        // 103010077 pour le build 77). Un APK de main est donc une préversion
        // de la version préparée ici, numérotée entre le tag précédent et
        // celui à venir — voir le tableau dans android.yml.
        //
        // Avant cet élargissement, les builds CI portaient le numéro de run nu :
        // 76 face au 10301 du tag v1.3.1. Pour Android c'était une
        // rétrogradation, et un APK de main refusait de s'installer par-dessus
        // une version publiée. Le prix de la correction est une inflation
        // irréversible du versionCode, qui ne redescend jamais.
        versionCode 105060000
        versionName "1.5.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Moteur de résumé local (llama.cpp, src/main/cpp). Les trois
        // architectures : filtrer sur arm64 seul rendrait l'APK ininstallable
        // sur un téléphone 32 bits (INSTALL_FAILED_NO_MATCHING_ABIS), alors que
        // le reste de l'app n'a aucune raison de l'exclure.
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
        // Toujours en Release, même pour l'APK debug : llama.cpp compilé sans
        // optimisation est inutilisable (dizaines de fois plus lent).
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_BUILD_TYPE=Release"
            }
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Sans ça, l'AGP glisse dans le bloc de signature de l'APK la liste chiffrée
    // de nos dépendances, destinée à Google Play. Inutile dans un APK distribué
    // hors du Play Store, et c'est du bruit dans le bloc de signature.
    //
    // À déclarer ici, dans « android », et non dans « defaultConfig » : Gradle
    // ne connaît pas la méthode là-bas.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    // Versions du NDK et de CMake ÉPINGLÉES : un build ne doit pas dépendre de
    // ce que le runner a de plus récent.
    ndkVersion "27.2.12479018"
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    // Bibliothèques natives de sherpa-onnx, posées dans build/ par fetchSherpa
    // (sherpa.gradle) : passer la tâche elle-même à srcDir suffit à Gradle pour
    // l'exécuter avant l'assemblage des bibliothèques natives.
    sourceSets {
        main {
            jniLibs.srcDir(project.ext.fetchSherpa)
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// La CI (.github/workflows/android.yml) écrase la version ci-dessus par le
// numéro de run, pour qu'un APK GitHub s'installe par-dessus le précédent.
// Écrit ici, après le bloc android, et non dans defaultConfig : là-haut, une
// expression Groovy rendrait la version illisible pour la CI, qui relit le
// littéral avec sed.
if (project.hasProperty('versionCode')) {
    android.defaultConfig.versionCode = project.property('versionCode') as Integer
}
if (project.hasProperty('versionName')) {
    android.defaultConfig.versionName = project.property('versionName')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Navigateur intégré : WebSettingsCompat.setAlgorithmicDarkeningAllowed, pour
    // que les articles s'affichent en sombre comme le reste de l'app. La version
    // est celle que Capacitor déclare déjà (variables.gradle) — aucune
    // bibliothèque nouvelle n'entre dans le paquet, capacitor-android l'embarque
    // déjà ; on la remonte simplement sur le classpath du module app.
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // Vérification en arrière-plan des sources (NewsCheckWorker) : réveil
    // périodique garanti même l'app fermée ou le téléphone redémarré, sans
    // service tiers — voir CLAUDE.md, « aucun appel à un tiers non choisi ».
    implementation "androidx.work:work-runtime:$workManagerVersion"
    // Décompression bzip2 de l'archive d'une voix (NeuralVoices). 1.21 et non une
    // version plus récente : la 1.26+ s'appuie sur java.nio.file et commons-io, qui
    // demandent Android 8 alors que le projet vise Android 7 (minSdk 24). Aucune
    // dépendance transitive ; l'archive est de toute façon vérifiée par SHA-256.
    implementation "org.apache.commons:commons-compress:1.21"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
